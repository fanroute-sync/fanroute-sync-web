language: ko-KR

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_instructions:
    - path: 'src/app/**'
      instructions: |
        Next.js App Router 규칙을 확인해주세요.
        불필요한 use client 사용, 서버 전용 데이터의 클라이언트 노출,
        loading/error/not-found 처리 누락을 중점적으로 검토해주세요.

    - path: 'src/features/**'
      instructions: |
        UI, API, 모델과 비즈니스 로직의 책임이 적절히 분리됐는지 확인해주세요.
        하나의 컴포넌트에 과도한 책임이 집중되지 않았는지 검토해주세요.

    - path: 'src/lib/api/**'
      instructions: |
        JWT 인증 처리, 공통 응답 포맷, 에러 코드 처리를 확인해주세요.
        any 사용, API 키 노출, 외부 API 직접 호출을 지적해주세요.

    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        TypeScript 타입 안정성, 접근성, 로딩·빈 상태·오류 상태를 확인해주세요.
        TanStack Query 서버 상태가 Zustand에 중복 저장되지 않았는지 검토해주세요.

  path_filters:
    - '!pnpm-lock.yaml'
    - '!**/*.snap'
    - '!**/*.gen.ts'
    - '!public/**'
    - '!coverage/**'
    - '!playwright-report/**'

chat:
  auto_reply: true
